<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1f2937">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>드론 비행구역 지도</title>
<style>
  :root { --bg:#ffffff; --fg:#111827; --muted:#6b7280; --panel:#ffffffee; --line:#e5e7eb; --accent:#2563eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111827; --fg:#f3f4f6; --muted:#9ca3af; --panel:#1f2937ee; --line:#374151; --accent:#60a5fa; }
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif; }
  #map { position:fixed; inset:0; }
  .panel { position:fixed; z-index:1000; background:var(--panel); border:1px solid var(--line);
    border-radius:12px; box-shadow:0 2px 10px #0003; backdrop-filter:blur(6px); }
  #top { top:10px; left:10px; right:10px; padding:8px 12px; font-size:14px; }
  #search { display:flex; gap:6px; margin-bottom:6px; }
  #search input { flex:1; min-width:0; font-size:16px; padding:8px 10px; border:1px solid var(--line); border-radius:8px;
    background:var(--bg); color:var(--fg); font-family:inherit; }
  #search button { font-size:15px; padding:0 14px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-family:inherit; }
  #status { min-width:0; line-height:1.35; }
  #suggest { display:none; margin:0 0 6px; max-height:50vh; overflow:auto; border:1px solid var(--line);
    border-radius:8px; background:var(--bg); }
  #suggest.open { display:block; }
  .s-item { display:block; width:100%; text-align:left; padding:9px 10px; border:0; border-top:1px solid var(--line);
    background:none; color:var(--fg); font:inherit; cursor:pointer; }
  .s-item:first-child { border-top:0; }
  .s-item:hover, .s-item:active { background:#2563eb22; }
  .s-item b { display:block; font-size:14px; }
  .s-item small { display:block; color:var(--muted); font-size:12px; margin-top:2px; }
  .s-msg { padding:9px 10px; color:var(--muted); }
  /* 누른 곳 말풍선 */
  .pp .leaflet-popup-content-wrapper { border-radius:10px; padding:0; background:rgba(255,255,255,.78);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); box-shadow:0 4px 14px rgba(0,0,0,.25);
    border:1px solid rgba(255,255,255,.6); }
  .pp .leaflet-popup-tip { background:rgba(255,255,255,.78); box-shadow:none; }
  .pp a.leaflet-popup-close-button { color:#6b7280; }
  .pp .leaflet-popup-content { margin:8px 26px 8px 10px; font-family:inherit; color:#111827; line-height:1.35; }
  .pp-z { margin-top:6px; padding-top:6px; border-top:1px solid rgba(0,0,0,.1); }
  .pp-z b { display:flex; align-items:center; gap:5px; font-size:13px; }
  .pp-z i { width:11px; height:11px; border:2px solid; border-radius:2px; flex:none; }
  .pp-z small { display:block; color:#4b5563; font-size:12px; margin-top:1px; }
  .pp-v { margin-top:6px; padding-top:5px; border-top:1px solid rgba(0,0,0,.1); font-weight:bold; font-size:13px; }
  .pp-v.ok { color:#15803d; } .pp-v.bad { color:#dc2626; } .pp-v.caution { color:#b45309; }
  .pp-z.dim { opacity:.55; }
  .caution { color:#d97706; }
  .pp-v.first { margin-top:0; padding-top:0; border-top:0; font-size:14px; }
  .pp-a { margin-top:6px; padding-top:5px; border-top:1px solid rgba(0,0,0,.1); font-size:12.5px; color:#1f2937; }
  .pp-a small { display:block; color:#6b7280; font-size:11.5px; margin-top:1px; }
  .pin { position:relative; width:26px; height:26px; background:#dc2626; border:3px solid #fff; border-radius:50% 50% 50% 0;
    transform:rotate(-45deg); box-shadow:0 2px 6px #0006; }
  .pin::after { content:""; position:absolute; left:7px; top:7px; width:6px; height:6px; border-radius:50%; background:#fff; }
  #info .r { display:block; width:100%; text-align:left; padding:8px 4px; border:0; border-top:1px solid var(--line);
    background:none; color:var(--fg); font:inherit; }
  #info .r small { color:var(--muted); }
  #status b { font-size:15px; }
  #layers { top:auto; bottom:84px; left:10px; padding:8px 10px; font-size:13px; max-width:calc(100% - 20px); display:none; }
  #layers.open { display:block; }
  #layers label { display:flex; align-items:center; gap:6px; padding:4px 0; }
  .sw { width:14px; height:14px; border-radius:3px; border:2px solid; flex:none; }
  #btns { bottom:16px; left:10px; right:10px; padding:6px; display:flex; gap:6px; }
  #btns button { flex:1; min-width:0; min-height:52px; font-size:13px; white-space:nowrap; padding:0 2px; border:1px solid var(--line); border-radius:9px;
    background:var(--bg); color:var(--fg); font-family:inherit; }
  #btns button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  #info { bottom:84px; left:10px; right:10px; padding:10px 12px; font-size:13px; display:none; max-height:45vh; overflow:auto; }
  #info.open { display:block; }
  #info h4 { margin:0 0 6px; font-size:14px; }
  #info .z { padding:6px 0; border-top:1px solid var(--line); }
  #info .z:first-of-type { border-top:0; }
  #info .x { float:right; border:0; background:none; color:var(--muted); font-size:18px; }
  .demo { color:#d97706; font-weight:bold; }
  .me { width:18px; height:18px; border-radius:50%; background:#2563eb; border:3px solid #fff; box-shadow:0 0 0 2px #2563eb88; transform:translate(-50%,-50%); }
  .ok { color:#16a34a; } .warn { color:#ea580c; } .bad { color:#dc2626; }
</style>
</head>
<body>
<div id="map"></div>
<div id="top" class="panel">
  <form id="search"><input id="q" type="search" placeholder="주소·장소 찾기 (예: 의정부시청)" enterkeyhint="search" autocomplete="off"><button type="submit">찾기</button></form>
  <div id="suggest"></div>
  <div id="status">불러오는 중…</div>
</div>
<div id="info" class="panel"></div>
<div id="layers" class="panel"></div>
<div id="btns" class="panel">
  <button id="bMe">📍 내 위치</button>
  <button id="bLayers">🗂 구역 종류</button>
  <button id="bSat">🛰 위성</button>
  <button id="bReload">↻ 새로받기</button>
</div>
<!-- 파일을 고치면 v= 숫자를 올려야 휴대폰이 옛 파일을 안 씀 -->
<script src="config.js?v=12"></script>
<script src="app.js?v=12"></script>
</body>
</html>
